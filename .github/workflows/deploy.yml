name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # allow pushing to gh-pages

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scala and SBT
        uses: olafurpg/setup-scala@v14
        with:
          java-version: adopt@1.11

      - name: Build project
        run: sbt fullOptCompileCopy

      - name: Prepare files for GitHub Pages
        run: |
          mkdir -p ./publish-folder/public/js
          cp ./index.html ./publish-folder/
          cp -r ./public/* ./publish-folder/public/
          touch ./publish-folder/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: publish-folder
          clean-exclude: pr-preview/
